<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .wrapper {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    canvas {
      background: #000;
      border: 3px solid white;
    }

    .panel {
      background: #1c1c1c;
      padding: 16px;
      border-radius: 12px;
      min-width: 180px;
    }

    h1 {
      margin-top: 0;
      font-size: 24px;
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #2d7ef7;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #1f68d1;
    }

    .small {
      font-size: 14px;
      color: #ccc;
      margin-top: 12px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <canvas id="game" width="300" height="600"></canvas>

    <div class="panel">
      <h1>Tetris</h1>
      <p><strong>Punkte:</strong> <span id="score">0</span></p>
      <p><strong>Zeilen:</strong> <span id="lines">0</span></p>
      <p><strong>Level:</strong> <span id="level">1</span></p>
      <button id="restartBtn">Neu starten</button>

      <div class="small">
        <strong>Steuerung:</strong><br>
        ← → bewegen<br>
        ↓ schneller fallen<br>
        ↑ drehen<br>
        Leertaste = sofort fallen
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const scoreEl = document.getElementById("score");
    const linesEl = document.getElementById("lines");
    const levelEl = document.getElementById("level");
    const restartBtn = document.getElementById("restartBtn");

    const COLS = 10;
    const ROWS = 20;
    const BLOCK = 30;

    const COLORS = [
      null,
      "#00f0f0", // I
      "#0000f0", // J
      "#f0a000", // L
      "#f0f000", // O
      "#00f000", // S
      "#a000f0", // T
      "#f00000"  // Z
    ];

    const SHAPES = [
      [],
      [[1, 1, 1, 1]], // I
      [[2, 0, 0], [2, 2, 2]], // J
      [[0, 0, 3], [3, 3, 3]], // L
      [[4, 4], [4, 4]], // O
      [[0, 5, 5], [5, 5, 0]], // S
      [[0, 6, 0], [6, 6, 6]], // T
      [[7, 7, 0], [0, 7, 7]]  // Z
    ];

    let board;
    let player;
    let score;
    let lines;
    let level;
    let dropCounter;
    let dropInterval;
    let lastTime;
    let gameOver;

    function createBoard() {
      return Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    }

    function createPiece(type) {
      return {
        matrix: SHAPES[type].map(row => [...row]),
        pos: { x: 0, y: 0 }
      };
    }

    function randomPiece() {
      const type = Math.floor(Math.random() * 7) + 1;
      return createPiece(type);
    }

    function resetPlayer() {
      player = randomPiece();
      player.pos.y = 0;
      player.pos.x = Math.floor(COLS / 2) - Math.floor(player.matrix[0].length / 2);

      if (collide(board, player)) {
        gameOver = true;
      }
    }

    function collide(board, player) {
      const m = player.matrix;
      const o = player.pos;

      for (let y = 0; y < m.length; y++) {
        for (let x = 0; x < m[y].length; x++) {
          if (
            m[y][x] !== 0 &&
            (
              board[y + o.y] === undefined ||
              board[y + o.y][x + o.x] === undefined ||
              board[y + o.y][x + o.x] !== 0
            )
          ) {
            return true;
          }
        }
      }
      return false;
    }

    function merge(board, player) {
      player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            board[y + player.pos.y][x + player.pos.x] = value;
          }
        });
      });
    }

    function rotate(matrix) {
      const result = matrix[0].map((_, i) => matrix.map(row => row[i]).reverse());
      return result;
    }

    function playerRotate() {
      const oldX = player.pos.x;
      const rotated = rotate(player.matrix);
      player.matrix = rotated;

      let offset = 1;
      while (collide(board, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
          player.matrix = rotateBack(player.matrix);
          player.pos.x = oldX;
          return;
        }
      }
    }

    function rotateBack(matrix) {
      return matrix[0].map((_, i) => matrix.map(row => row[row.length - 1 - i]));
    }

    function playerMove(dir) {
      player.pos.x += dir;
      if (collide(board, player)) {
        player.pos.x -= dir;
      }
    }

    function playerDrop() {
      player.pos.y++;
      if (collide(board, player)) {
        player.pos.y--;
        merge(board, player);
        clearLines();
        resetPlayer();
        updateStats();
      }
      dropCounter = 0;
    }

    function hardDrop() {
      while (!collide(board, player)) {
        player.pos.y++;
      }
      player.pos.y--;
      merge(board, player);
      clearLines();
      resetPlayer();
      updateStats();
      dropCounter = 0;
    }

    function clearLines() {
      let rowCount = 0;

      outer: for (let y = board.length - 1; y >= 0; y--) {
        for (let x = 0; x < board[y].length; x++) {
          if (board[y][x] === 0) {
            continue outer;
          }
        }

        const row = board.splice(y, 1)[0].fill(0);
        board.unshift(row);
        y++;
        rowCount++;
      }

      if (rowCount > 0) {
        const points = [0, 40, 100, 300, 1200];
        score += points[rowCount] * level;
        lines += rowCount;
        level = Math.floor(lines / 10) + 1;
        dropInterval = Math.max(100, 1000 - (level - 1) * 80);
      }
    }

    function drawCell(x, y, value) {
      ctx.fillStyle = COLORS[value];
      ctx.fillRect(x * BLOCK, y * BLOCK, BLOCK, BLOCK);
      ctx.strokeStyle = "#111";
      ctx.strokeRect(x * BLOCK, y * BLOCK, BLOCK, BLOCK);
    }

    function drawBoard() {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      board.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) drawCell(x, y, value);
        });
      });

      player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            drawCell(x + player.pos.x, y + player.pos.y, value);
          }
        });
      });

      if (gameOver) {
        ctx.fillStyle = "rgba(0,0,0,0.75)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "white";
        ctx.font = "bold 36px Arial";
        ctx.textAlign = "center";
        ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2);

        ctx.font = "20px Arial";
        ctx.fillText("Neu starten klicken", canvas.width / 2, canvas.height / 2 + 40);
      }
    }

    function updateStats() {
      scoreEl.textContent = score;
      linesEl.textContent = lines;
      levelEl.textContent = level;
    }

    function update(time = 0) {
      const deltaTime = time - lastTime;
      lastTime = time;

      if (!gameOver) {
        dropCounter += deltaTime;
        if (dropCounter > dropInterval) {
          playerDrop();
        }
      }

      drawBoard();
      requestAnimationFrame(update);
    }

    function startGame() {
      board = createBoard();
      score = 0;
      lines = 0;
      level = 1;
      dropCounter = 0;
      dropInterval = 1000;
      lastTime = 0;
      gameOver = false;
      resetPlayer();
      updateStats();
    }

    document.addEventListener("keydown", event => {
      if (gameOver) return;

      if (event.key === "ArrowLeft") {
        playerMove(-1);
      } else if (event.key === "ArrowRight") {
        playerMove(1);
      } else if (event.key === "ArrowDown") {
        playerDrop();
      } else if (event.key === "ArrowUp") {
        playerRotate();
      } else if (event.code === "Space") {
        event.preventDefault();
        hardDrop();
      }
    });

    restartBtn.addEventListener("click", startGame);

    startGame();
    update();
  </script>
</body>
</html>
